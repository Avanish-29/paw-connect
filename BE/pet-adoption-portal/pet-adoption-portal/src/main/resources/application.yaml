spring:
  application:
    name: pet-adoption-portal

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/pet_adoption_portal}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:pet-adoption-portal-dev-jwt-secret-key-change-in-production-256bits}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

logging:
  level:
    root: INFO
    com.petadoption.portal: DEBUG
