spring:
  datasource:
    url: jdbc:h2:mem:pet_adoption_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

jwt:
  secret: test-jwt-secret-key-that-is-long-enough-for-hmac-sha-256-algo
  expiration-ms: 3600000

logging:
  level:
    com.petadoption.portal: INFO
